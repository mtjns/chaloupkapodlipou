<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LodgingBusiness",
  "@id": "{{ site.url }}/#business",
  "name": "Chaloupka pod lípou",
  "description": {{ site.description | jsonify }},
  "url": "{{ site.url }}",
  "image": "{{ '/assets/images/og-image.jpg' | absolute_url }}",
  "logo": "{{ site.logo | absolute_url }}",
  "email": {{ site.email | jsonify }},
  "telephone": {{ site.phone | jsonify }},
  "priceRange": "5 900–7 900 Kč / noc",
  "currenciesAccepted": "CZK",
  "smokingAllowed": false,
  "petsAllowed": false,
  "numberOfRooms": 5,
  "checkinTime": "14:00",
  "checkoutTime": "10:00",
  "availableLanguage": ["cs", "en", "de", "pl", "fr"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": {{ site.cottage_address | jsonify }},
    "addressLocality": "Malé Svatoňovice",
    "postalCode": "542 34",
    "addressRegion": "Královéhradecký kraj",
    "addressCountry": "CZ"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 50.540712,
    "longitude": 16.0474436
  },
  "hasMap": "https://www.google.com/maps/search/?api=1&query={{ site.map_query | url_encode }}",
  "sameAs": [
    "https://www.booking.com/hotel/cz/chaloupka-pod-lipou.cs.html",
    "https://www.e-chalupy.cz/ubytovani-male-svatonovice-chaloupka-pod-lipou-pronajem-o17388",
    "https://maps.app.goo.gl/ZLFLgANM88Jbrjft8"
  ],
  "areaServed": {
    "@type": "Country",
    "name": "Česká republika"
  },
  "containsPlace": {
    "@type": "Accommodation",
    "name": "Chaloupka pod lípou — celý objekt",
    "numberOfBedrooms": 5,
    "numberOfBathroomsTotal": 2,
    "occupancy": {
      "@type": "QuantitativeValue",
      "maxValue": 15,
      "unitText": "osob"
    }
  },
  "amenityFeature": [
    { "@type": "LocationFeatureSpecification", "name": "Zahrada", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Ohniště", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Plynový gril", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Kolárna pro kola", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Plně vybavená kuchyně", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Zákaz kouření", "value": true }
  ],
  {%- comment -%}
    aggregateRating + review[] mirror the reviews rendered on the home page
    (data source: _data/reviews.yml). Google ratings are 1–5, Booking 1–10, so
    each review keeps its own bestRating; the aggregate normalises everything to
    a 5-point scale (Booking value / 2) for a single comparable score.
  {%- endcomment -%}
  {%- assign rtotal = 0.0 -%}
  {%- assign rcount = 0 -%}
  {%- for r in site.data.reviews.reviews -%}
    {%- if r.source == "google" -%}
      {%- assign norm = r.rating | times: 1.0 -%}
    {%- else -%}
      {%- assign norm = r.rating | divided_by: 2.0 -%}
    {%- endif -%}
    {%- assign rtotal = rtotal | plus: norm -%}
    {%- assign rcount = rcount | plus: 1 -%}
  {%- endfor -%}
  {%- assign ravg = rtotal | divided_by: rcount | round: 2 -%}
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": {{ ravg }},
    "bestRating": 5,
    "worstRating": 1,
    "reviewCount": {{ rcount }}
  },
  "review": [
    {%- for r in site.data.reviews.reviews -%}
    {
      "@type": "Review",
      "author": { "@type": "Person", "name": {{ r.name | jsonify }} },
      "reviewRating": {
        "@type": "Rating",
        "ratingValue": {{ r.rating }},
        "bestRating": {% if r.source == "google" %}5{% else %}10{% endif %},
        "worstRating": 1
      },
      "reviewBody": {{ r.text | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
