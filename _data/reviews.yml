# Guest reviews — data source for a future reviews section on the site.
#
# These entries are placeholders. Replace them with real reviews you have
# permission to display, quoting each guest accurately. Once a visible reviews
# section is rendered on the page, wire aggregateRating + review[] into
# _includes/structured-data.html so search engines can show the star rating
# (Google requires the reviews to be visible on the page).
#
# Fields per review:
#   name    Reviewer's display name, as shown on the review platform.
#   photo   Profile picture — a local file under /assets/images/reviews/.
#           Use "" (empty) to fall back to an initials avatar in the UI.
#   rating  Whole number 1–5 (stars the guest gave).
#   source  Where the review came from: "google" or "booking".
#   text    The review text, as the guest wrote it.

