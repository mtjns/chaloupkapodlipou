title: "Chaloupka pod lípou"
tagline: "Chaloupkapa v Malých Svatoňovicích"
# Google/SEO meta description (Czech default; en/de/pl get their own via `defaults`
# below). The longer share/social blurb lives in og_description on each page.
description: "Naše Chaloupka pod lípou je místo, kde se historie snoubí s moderním pohodlím. Tato stylová chalupa se nachází v obci Malé Svatoňovice a je ideálním místem pro vaši dovolenou."
logo: "/assets/images/logo/logo.png"

url: "https://test.chaloupkapodlipou.cz"
baseurl: ""

# Site-wide default language. Individual pages under /en/ override this via
# front matter (lang: en) — see _includes/head.html and _data/*.yml.
lang: cs-CZ

# Default social-share image (Open Graph / Twitter) applied to every page unless a
# page overrides it with `image:` in its front matter. Sized 1200×630 (1.91:1).
defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.jpg"
        width: 1200
        height: 630
        alt: "Chaloupka pod lípou — chalupa v Malých Svatoňovicích"
  - scope:
      path: ""
    values:
      lang: cs
  - scope:
      path: "en"
    values:
      lang: en
  # Per-language default SEO meta description. Without these, jekyll-seo-tag falls
  # back to the (Czech) site.description on every en/de/pl page — so foreign-language
  # search snippets would appear in Czech. Pages can still override with `description`.
  - scope:
      path: "pages/en"
    values:
      description: "Chaloupka pod lípou is where history meets modern comfort. This charming cottage in Malé Svatoňovice is an ideal place for your holiday."
  - scope:
      path: "pages/de"
    values:
      description: "Die Chaloupka pod lípou verbindet Geschichte mit modernem Komfort. Dieses stilvolle Ferienhaus in Malé Svatoňovice ist der ideale Ort für Ihren Urlaub."
  - scope:
      path: "pages/pl"
    values:
      description: "Chaloupka pod lípou to miejsce, gdzie historia łączy się z nowoczesnym komfortem. Ten stylowy domek w Malých Svatoňovicach to idealne miejsce na Państwa wakacje."

author:
  name: "Lenka Jansová"
  email: "chaloupkapodlipou@gmail.com"

social:
  name: "Chaloupka pod lípou"
  links: []

twitter:
  card: summary_large_image

# e-chalupy.cz availability calendar embed id (Rezervace/Reservation page).
echalupy_id: "17388"

# Google Apps Script Web App URL that receives the reservation form submissions.
reservation_script_url: "https://script.google.com/macros/s/AKfycbzkmGbkCM20c2GRC-XyxXuKzOTFHSpNyrA4mLu-TwXXcmbT8eTPHHDpBbUWXo3vpJlF/exec"

# Google Apps Script Web App URL that receives the guest-registration (kniha hostů)
# apps-script/guestbook.gs (Execute as: me; Access: Anyone).
guestbook_script_url: "https://script.google.com/macros/s/AKfycbyBZNo27kUrhiTbjIKBEuUb_ICqMUn-v8GS1jd-kCzuhqVJnCuSlzWi-1pDG5Lj-9SH/exec"

# Contact + legal/business info shown in the footer.
email: "chaloupkapodlipou@gmail.com"
phone: "+420 602 967 096"
phone_link: "+420602967096"

operator:
  name: "Lenka Jansová"
  ico: "19487452"
  address: "K Žabárně 880, Rtyně v Podkrkonoší"

# Physical address of the cottage itself (distinct from the operator's registered
# business address above). Used for the footer contact link and the Maps query.
cottage_address: "Malé Svatoňovice 80"

# Google Maps search query, used to build the "open in Maps" link in the footer.
map_query: "Chaloupka pod lípou, Malé Svatoňovice 80"

# Exclude raw development files from the production build
exclude:
  - .devcontainer/
  - Gemfile
  - Gemfile.lock
  - .git/
  - "**/*.md"
  - "*.md"
  - apps-script/
  - .claude/

# Required plugins for SEO and sitemap generation
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap