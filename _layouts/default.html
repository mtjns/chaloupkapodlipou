{%- comment -%}
Full site layout: fixed nav + footer, content rendered as-is with no wrapper.
Used by the main marketing pages (home, reservation, area, FAQ, info, privacy).
{%- endcomment -%}
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'cs' }}">

{% include head.html %}

<body>

</body>

</html>
